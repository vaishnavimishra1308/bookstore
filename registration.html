 
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link rel="stylesheet" href="style.css">
</head>
<body style="background-color: #8b63a2; display: flex; justify-content: center; align-items: center; height: 150vh;">   

    <div class="auth-card">
        <h1>📚 Bookstore</h1>
        <br>
        <h2>Create Account</h2>
        <br>
    
<th>Welcome to Bookstore! Please fill in the details below to create your account.</th>
<br>
<br>
<form id="register-form">
            <label for="reg-name">Full Name</label>
         
            <input type="text" id="reg-name"
            
                   placeholder="Enter your name" required>
                </form>
            
<br>
<br>

            <label for="reg-email">Email Address</label>
            
            <input type="email" id="reg-email"
                   placeholder="Enter your email" required>
    
<br>
<br>
            <label for="reg-password">Password</label>
            
            <input type="password" id="reg-password"
    
            placeholder="At least 6 characters"

            minlength="6" required>
            <br>
            <br>


            <label for="confirm-password">Confirm Password</label>
            
            <input type="password" id="confirm-password"
                   placeholder="Re-enter your password" required>

                   <br>
<br>
            <label for="reg-phone number">Phone Number</label>
            
            <input type="tel" id="reg-phone"
                   placeholder="Enter your phone number" required>
<br>
<br>

            <label for="reg-gender">Gender</label>
            
            <select id="reg-gender" required>
                <option value="">Select Gender</option>
                <option value="male">Male</option>
                <option value="female">Female</option>
                <option value="other">Other</option>
            </select>
<br>
<br>
            <label for="reg-date-of-birth">Date of Birth</label>
            
            <input type="date" id="reg-date-of-birth" required>
<br>
<br>
              <label for="reg-languages known">Languages Known</label>
        
                <select id="reg-languages" required>
                     <option value="">Select Languages</option>
                <option value="english">English</option>
                <option value="malayalam">Malayalam</option>
                <option value="telugu">Telugu</option>
                <option value="hindi">Hindi</option>
                <option value="tamil">Tamil</option>
        
            </select>
<br>
<br>
            <label for="reg-address">Address</label>
            <textarea id="reg-address" placeholder="Enter your address" required></textarea>
            <br>
<br>            
            <button type="submit">Create Account</button>
            <p id="register-message" role="status"></p>
             
        </form> 
<br>
<br>
        <p>Already have an account?
            <a href="login.html">Login here</a>
        </p>

        <a href="index.html">← Back to Home</a>
    </div>

    <script src="script.js"></script>
</body>
</html>
