<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Cart </title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f0e8;
            color: #be749e;
        }

        header {
            background: #d171ac;
            color: white;
            padding: 20px;
            text-align: center;
        }

        nav {
            background: #fa88c5;
            padding: 12px;
            text-align: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 0 15px;
        }

        .container {
            width: 90%;
            max-width: 1000px;
            margin: 35px auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
        }

        h2 {
            text-align: center;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            padding: 15px 0;
            border-bottom: 1px solid #ddd;
        }

        .cart-item h3 {
            margin: 0 0 8px;
        }

        .remove-btn {
            background: #d469af;
            color: white;
            border: none;
            padding: 9px 12px;
            border-radius: 5px;
            cursor: pointer;
        }

        .summary {
            text-align: right;
            margin-top: 25px;
        }

        .btn {
            display: inline-block;
            padding: 12px 18px;
            margin: 5px;
            border: none;
            border-radius: 5px;
            background: #f473d4;
            color: white;
            text-decoration: none;
            cursor: pointer;
        }

        .empty {
            text-align: center;
            padding: 30px;
        }

        footer {
            background: #d966b5;
            color: white;
            text-align: center;
            padding: 15px;
            margin-top: 40px;
        }

        @media (max-width: 600px) {
            .cart-item {
                align-items: flex-start;
                flex-direction: column;
            }

            .summary {
                text-align: center;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>📚 Bookstore</h1>
        <p>Your Favourite Books, All in One Place</p>
    </header>

    <nav>
        <a href="index.html">Home</a>
        <a href="catalogue.html">Catalogue</a>
        <a href="cart.html">My Cart</a>
    </nav>

    <div class="container">
        <h2>🛒 My Shopping Cart</h2>

        <div id="cart-items"></div>

        <div class="summary">
            <h3>Total: ₹<span id="total">0</span></h3>

            <a href="catalogue.html" class="btn">
                Continue Shopping
            </a>

            <a href="checkout.html" class="btn" id="checkout-btn">
                Proceed to Checkout
            </a>
        </div>
    </div>

    <footer>
        <p>© 2026 Bookstore | All Rights Reserved</p>
    </footer>

    <script>
        let cart = JSON.parse(localStorage.getItem("bookCart")) || [];

        function displayCart() {
            const cartItems = document.getElementById("cart-items");
            const totalElement = document.getElementById("total");
            const checkoutBtn = document.getElementById("checkout-btn");

            cartItems.innerHTML = "";
            let total = 0;

            if (cart.length === 0) {
                cartItems.innerHTML = `
                    <div class="empty">
                        <h3>Your cart is empty!</h3>
                        <p>Visit our catalogue to find your next favourite book.</p>
                    </div>
                `;

                checkoutBtn.style.pointerEvents = "none";
                checkoutBtn.style.opacity = "0.5";
            } else {
                checkoutBtn.style.pointerEvents = "auto";
                checkoutBtn.style.opacity = "1";

                cart.forEach((book, index) => {
                    const price = Number(book.price) || 0;
                    total += price;

                    cartItems.innerHTML += `
                        <div class="cart-item">
                            <div>
                                <h3>${book.title}</h3>
                                <p>Author: ${book.author || "Unknown"}</p>
                                <strong>Price: ₹${price}</strong>
                            </div>

                            <button class="remove-btn"
                                onclick="removeBook(${index})">
                                Remove
                            </button>
                        </div>
                    `;
                });
            }

            totalElement.textContent = total;
        }

        function removeBook(index) {
            cart.splice(index, 1);
            localStorage.setItem("bookCart", JSON.stringify(cart));
            displayCart();
        }

        displayCart();
    </script>

</body>
</html>
```
